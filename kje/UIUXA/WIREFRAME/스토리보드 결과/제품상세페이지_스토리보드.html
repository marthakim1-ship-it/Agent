<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOVIA P-002 제품 상세</title><style>*{box-sizing:border-box}body{margin:0;background:#ddd;color:#222;font:16px/1.5 Arial,"Noto Sans KR",sans-serif}button,select{font:inherit}.page{max-width:1100px;margin:auto;background:#fff}.header,footer{padding:20px 28px;background:#ddd}.nav,.actions,.states{display:flex;gap:8px;flex-wrap:wrap}.nav button,.actions button,.states button{border:1px solid;padding:8px 11px;background:#fff}.nav [aria-current=page],.states [aria-pressed=true],.primary{background:#555;color:#fff}main{padding:32px 28px}.states{margin:20px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}.image,.panel,.notice,.state-message{border:1px solid #999;padding:20px}.image{min-height:280px;display:grid;place-items:center;text-align:center;border-style:dashed;background:#eee}.panel h2{margin-top:4px}.notice{border-left:5px solid;background:#eee}.state-message{display:none;border-style:dashed;background:#eee}select{width:100%;max-width:620px;padding:10px;margin-top:8px}.actions{margin-top:24px}@media(max-width:767px){.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}main{padding:22px 16px}}</style></head><body><div class="page"><header class="header"><strong>YOVIA</strong><nav class="nav" aria-label="주요 화면"><button data-go="P-001">홈</button><button data-go="P-006">제품 카테고리</button><button data-go="P-005">브랜드 소개</button><button aria-current="page">제품 상세</button><button data-go="P-003">사용 안내</button><button data-go="P-004">성분·영양</button></nav></header><main><p>P-002 · 후보 설계</p><h1 tabindex="-1">선택한 yovia 상품 정보</h1><p>PRODUCT ID에 따라 확인된 정보와 HOLD 항목을 구분합니다.</p><div class="states" aria-label="검토용 상태 도구"><button data-state="default" aria-pressed="true">기본</button><button data-state="loading" aria-pressed="false">로딩</button><button data-state="empty" aria-pressed="false">빈 상태</button><button data-state="error" aria-pressed="false">오류</button><button data-state="complete" aria-pressed="false">완료</button></div><div class="state-message" role="status" aria-live="polite"></div><div class="content"><label for="product"><strong>상품 선택</strong></label><select id="product"></select><div class="layout"><div class="image" id="image" role="img">PRODUCT-001<br>실제 이미지 추가 필요</div><section class="panel" id="result" aria-live="polite"><small id="pid">PRODUCT-001</small><h2 id="name">120g 모닝 파우치</h2><p id="group">YOVIA 팩 · 기본</p><p><strong id="status">기획서 명시</strong></p><h3>확인된 구성</h3><p id="copy"></p></section></div><div class="notice"><strong>정보 통제:</strong> 이미지·가격·재고·구매·원료·영양·알레르기와 패키지 성능은 공식 자료 확보 전 확정하지 않습니다.</div><div class="actions"><button class="primary" data-go="P-006">카테고리로 돌아가기</button><button data-go="P-003">사용 안내</button><button data-go="P-004">성분·영양</button><button data-go="P-001">홈</button><button data-complete>선택 상품 확인 완료</button></div></div></main><footer>PRODUCT-001~015 · 단일 동적 상세 · 판매 기능 보류</footer></div><script>
const names=['120g 모닝 파우치','400g 홈트레이닝 팩','800g 그릭 매니아 팩',...Array.from({length:5},(_,i)=>'생과일 퓨레 스틱 0'+(i+1)),...Array.from({length:3},(_,i)=>'견과류 토핑 0'+(i+1)),'yovia 7AM 갓생 팩','yovia 3PM 리프레시 팩','yovia 위켄드 뷰티 팩','yovia 스타터 팩'];const signatures={12:'120g 베이스 + 통곡물 그래놀라·호두 + 블루베리 퓨레 조합 제안입니다.',13:'120g 베이스 + 카카오닙스·코코넛 + 스트로베리 퓨레 조합 제안입니다.',14:'120g 또는 400g 베이스 + 햄프씨드·아몬드 + 망고 퓨레 조합 제안입니다.',15:'시그니처 3종을 각 2개씩 담는 총 6개입 구성 제안입니다.'};const products=names.map((name,i)=>{const n=i+1,id='PRODUCT-'+String(n).padStart(3,'0');if(n<=3)return{id,name,group:'YOVIA 팩 · 기본',status:'기획서 명시',copy:name.split(' ')[0]+' 베이스 제품입니다. 세부 사양은 확인이 필요합니다.'};if(n<=8)return{id,name,group:'페어링 · 퓨레',status:'세부 과일 맛 HOLD',copy:'팩과 조합하는 퓨레 슬롯입니다. 실제 맛·원료는 확인이 필요합니다.'};if(n<=11)return{id,name,group:'페어링 · 토핑',status:'세부 조합 HOLD',copy:'팩과 조합하는 토핑 슬롯입니다. 실제 조합·알레르기 정보는 확인이 필요합니다.'};return{id,name,group:n===15?'YOVIA 팩 · 스타터':'YOVIA 팩 · 시그니처',status:n===15?'런칭 기획 상품':'시그니처 메뉴 제안',copy:signatures[n]}});const select=document.getElementById('product'),pidEl=document.getElementById('pid'),nameEl=document.getElementById('name'),groupEl=document.getElementById('group'),statusEl=document.getElementById('status'),copyEl=document.getElementById('copy'),imageEl=document.getElementById('image');products.forEach(p=>select.add(new Option(p.id+' · '+p.name,p.id)));function render(id){const p=products.find(x=>x.id===id)||products[0];select.value=p.id;pidEl.textContent=p.id;nameEl.textContent=p.name;groupEl.textContent=p.group;statusEl.textContent=p.status;copyEl.textContent=p.copy;imageEl.innerHTML=p.id+'<br>실제 이미지 추가 필요';imageEl.setAttribute('aria-label',p.name+' 이미지 자리')}select.onchange=()=>render(select.value);const stateText={loading:'선택 상품 자료를 불러오고 있습니다.',empty:'선택 상품의 확정 자료가 아직 없습니다.',error:'상품 자료를 표시하지 못했습니다. PRODUCT-001로 재설정할 수 있습니다.',complete:'선택 상품 확인을 완료했습니다.'};function state(value){document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===value));const box=document.querySelector('.state-message'),content=document.querySelector('.content');if(value==='default'){box.style.display='none';content.hidden=false}else{box.textContent=stateText[value];box.style.display='block';content.hidden=true}}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>state(b.dataset.state));document.querySelector('[data-complete]').onclick=()=>state('complete');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>alert(b.dataset.go+' 화면으로 이동하는 스토리보드 동작입니다.'));render(new URLSearchParams(location.search).get('product'));
</script></body></html>
