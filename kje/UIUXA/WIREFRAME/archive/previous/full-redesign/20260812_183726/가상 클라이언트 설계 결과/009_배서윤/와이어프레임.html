<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VC-009 배서윤 와이어프레임</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Noto Sans KR","Malgun Gothic",sans-serif;color:#202124;background:#e9edf2}button,input{font:inherit;min-height:44px}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}aside{padding:18px;background:#172033;color:#fff;overflow:auto;height:100vh;position:sticky;top:0}aside button{width:100%;margin:4px 0;text-align:left;background:#26334d;color:#fff;border:1px solid #667085;padding:8px}.work{padding:20px}.device{max-width:1280px;margin:auto;background:#fff;border:2px solid #344054}.global,.footer{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:2px solid #98a2b3}.footer{border-top:2px solid #98a2b3;border-bottom:0}.brand{font-weight:800;margin-right:auto}.screen{padding:24px;min-height:600px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.placeholder{border:2px solid #98a2b3;padding:16px}.placeholder{min-height:180px;display:grid;place-items:center;background:#f2f4f7;border-style:dashed}.status{padding:5px 8px;border:1px solid #027a48;color:#027a48}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button:first-child{background:#175cd3;color:#fff}.note{padding:12px;background:#fffaeb;border-left:5px solid #b54708}:focus-visible{outline:3px solid #f79009;outline-offset:2px}@media(max-width:1199px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:767px){.app{display:block}aside{position:static;height:auto;max-height:260px}.work{padding:8px}.grid{grid-template-columns:1fr}.global{flex-wrap:wrap}.brand{width:100%}.screen{padding:14px}}</style></head><body><div class="app"><aside><h1>VC-009 배서윤</h1><p>화면 목차</p><nav id="toc"></nav></aside><main class="work"><div class="device"><a href="#screen" style="position:absolute;left:-9999px">본문 바로가기</a><header class="global"><span class="brand">YOVIA</span><button data-go="SCR-001">홈</button><button data-go="SCR-002">사용 방법</button><button data-go="SCR-003">정리 안내</button></header><section id="screen" class="screen" tabindex="-1" aria-live="polite"></section><footer class="footer"><button data-go="SCR-001">홈</button><span>검증 상태와 기준일 확인</span></footer></div></main></div><script>const screens=[{"id":"SCR-001","name":"홈","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 홈 화면","entryConditions":["최초 진입 또는 오류 복구"],"sections":["공통 헤더","정리 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-002","SCR-003"]},{"id":"SCR-002","name":"사용 방법","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 사용 방법 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","잔여물 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-003","SCR-001"]},{"id":"SCR-003","name":"정리 안내","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 정리 안내 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","폐기 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-004","SCR-002"]},{"id":"SCR-004","name":"폐기 안내","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 폐기 안내 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","소재 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-005","SCR-003"]},{"id":"SCR-005","name":"소재·환경","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 소재·환경 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","분리배출 조건 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-006","SCR-004"]},{"id":"SCR-006","name":"검증 정보","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 검증 정보 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","근거 범위 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-007","SCR-005"]},{"id":"SCR-007","name":"제품 상세","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 제품 상세 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","기준일 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-008","SCR-006"]},{"id":"SCR-008","name":"보류 정보","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 보류 정보 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","금지 주장 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-009","SCR-007"]},{"id":"SCR-009","name":"다음 행동","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 다음 행동 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","정리 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-010","SCR-008"]},{"id":"SCR-010","name":"로그인","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 로그인 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","잔여물 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":["기본","로딩","빈 상태","오류","완료"],"nextScreens":["SCR-011","SCR-009"]},{"id":"SCR-011","name":"결과 없음","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 결과 없음 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","폐기 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":"빈 상태","nextScreens":["SCR-012","SCR-010"]},{"id":"SCR-012","name":"입력 오류 안내","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 입력 오류 안내 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","소재 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":"오류","nextScreens":["SCR-013","SCR-011"]},{"id":"SCR-013","name":"오류 안내","purpose":"사용 후 정리·잔여물·폐기 과정과 환경 주장 근거를 연결하는 정보 — 오류 안내 화면","entryConditions":["이전 정상 화면 또는 직접 링크"],"sections":["공통 헤더","분리배출 조건 정보","상태 안내","주요 행동","공통 푸터"],"actions":["다음 화면","이전 화면","홈"],"states":"오류","nextScreens":["SCR-001"]}];const byId=Object.fromEntries(screens.map(s=>[s.id,s]));const toc=document.querySelector('#toc'),host=document.querySelector('#screen');screens.forEach(s=>{const b=document.createElement('button');b.dataset.go=s.id;b.textContent=s.id+' · '+s.name;toc.append(b)});function render(id){const s=byId[id]||byId['SCR-001'];host.innerHTML='<small>'+s.id+'</small><h2>'+s.name+'</h2><p>'+s.purpose+'</p><div class="grid"><div class="placeholder" role="img" aria-label="'+s.name+' 관련 이미지 플레이스홀더">이미지 플레이스홀더<br>대체 텍스트 포함</div><div class="card"><h3>핵심 정보</h3><p>정리 · 잔여물 · 폐기 · 소재 · 분리배출 조건 · 근거 범위 · 기준일 · 금지 주장</p></div><div class="card"><h3>상태</h3><span class="status">CONFIRMED</span><p>NOT_VERIFIED · HOLD 병기</p></div></div><div class="note">가정 및 검증 필요: 친환경·생분해·폐기 감소 수치</div><div class="actions">'+s.nextScreens.map((n,i)=>'<button data-go="'+n+'">'+byId[n].name+'</button>').join('')+'</div>';location.hash=s.id;host.focus()}document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)render(b.dataset.go)});render(location.hash.slice(1)||'SCR-001');</script></body></html>
