<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOVIA VC-002 와이어프레임</title><style>
:root{--ink:#172033;--muted:#64748b;--line:#cbd5e1;--panel:#f8fafc;--accent:#2563eb;--warn:#9a3412;--assume:#6d28d9}*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:#e2e8f0}button{font:inherit}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:20px;position:sticky;top:0;height:100vh;overflow:auto}.side h1{font-size:18px;margin:0}.side p{font-size:12px;color:#cbd5e1}.toc{display:grid;gap:4px}.toc button{border:0;background:transparent;color:#e5e7eb;text-align:left;padding:8px;border-radius:6px;cursor:pointer}.toc button:hover,.toc button[aria-current=page]{background:#334155}.main{padding:24px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer}.toolbar .active{background:#dbeafe;border-color:var(--accent)}.note{padding:10px 12px;background:#fff7ed;border-left:4px solid #ea580c;font-size:13px;margin-bottom:16px}.device{margin:auto;background:#fff;border:2px solid #334155;min-height:780px;box-shadow:0 12px 30px #0f172a22}.desktop{max-width:1200px}.tablet{max-width:820px}.mobile{max-width:390px}.site-head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:#fff;z-index:2}.logo{font-weight:800;cursor:pointer}.global{display:flex;gap:9px;flex:1;flex-wrap:wrap}.global button,.site-foot button{border:0;background:transparent;text-decoration:underline;cursor:pointer}.screen{padding:22px}.meta{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}.badge{display:inline-block;padding:3px 7px;border:1px solid currentColor;border-radius:999px;font-size:12px;color:var(--muted)}.assume{color:var(--assume)}.conditional{color:var(--warn)}.hero,.block{border:2px solid var(--line);background:var(--panel);padding:18px;margin:16px 0}.hero{min-height:180px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.placeholder{border:2px dashed #94a3b8;background:#fff;min-height:120px;display:grid;place-items:center;text-align:center;padding:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #94a3b8;background:#fff;padding:14px;min-height:150px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{padding:10px 13px;border:2px solid var(--ink);background:#fff;border-radius:5px;cursor:pointer}.actions .primary{background:var(--ink);color:#fff}.states{display:flex;gap:6px;flex-wrap:wrap}.site-foot{border-top:1px solid var(--line);padding:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}.mobile .global{display:none}.mobile .hero,.mobile .grid{grid-template-columns:1fr}.tablet .grid{grid-template-columns:repeat(2,1fr)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.toc{grid-template-columns:repeat(2,1fr)}.main{padding:10px}.device{max-width:100%!important}.hero,.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><h1>YOVIA VC-002 화면 목차</h1><p>패키지 구조·사용 단계·품질 검증 중심 저충실도 와이어프레임</p><nav id="toc" class="toc" aria-label="화면 목차"></nav></aside><main class="main"><div class="toolbar"><strong>뷰포트</strong><button data-size="desktop" class="active">데스크톱</button><button data-size="tablet">태블릿</button><button data-size="mobile">모바일</button></div><div class="note">시험·사용 전후·소재·다음 행동은 조건부입니다. 로그인·저장·검색은 가정입니다.</div><div id="device" class="device desktop"><header class="site-head"><div class="logo" tabindex="0" role="link" data-go="P00">YOVIA</div><nav class="global" aria-label="전역 메뉴"><button data-go="P10">제품</button><button data-go="P20">제품 구조</button><button data-go="P30">사용 방법</button><button data-go="P40">품질·검증</button></nav><button data-go="P70">검색 <span class="badge assume">가정</span></button></header><section id="screen" class="screen" aria-live="polite"></section><footer class="site-foot"><span>CONFIRMED · NOT_VERIFIED · HOLD · 대안</span><span><button data-go="P73">정책·접근성</button> · <button data-go="P00">홈</button></span></footer></div></main></div><script>
const screens=[
{id:'P00',name:'홈',purpose:'실제 구조와 핵심 사용 단계 진입',sections:['실제 제품 히어로','구조 요약','사용 단계 요약','검증 상태'],states:['기본','로딩','오류'],next:['P10','P20','P30','P40']},
{id:'P10',name:'제품',purpose:'제품 정보 탐색 허브',sections:['확정 제품','사양 상태','상세 진입'],states:['기본','로딩','제품 미확정'],next:['P11']},
{id:'P11',name:'제품 상세',purpose:'구조·사용·품질 정보 통합 확인',sections:['제품 갤러리','부품 요약','사용 단계','검증 요약','조건부 CTA'],states:['기본','로딩','미확정 정보','오류'],next:['P20','P30','P40','P50','P60']},
{id:'P20',name:'제품 구조',purpose:'파우치·스푼·토핑 관계 이해',sections:['실제 구조 이미지','부품 라벨','관계 설명','상태 범례'],states:['기본','로딩','자산 미확정'],next:['P11','P21','P30']},
{id:'P21',name:'부품 상세',purpose:'부품 역할·결합 상태 확인',sections:['부품 이미지','명칭·역할','결합 관계','검증 상태'],states:['기본','로딩','부품 자료 미확정'],next:['P20','P30']},
{id:'P30',name:'사용 방법',purpose:'개봉→결합→취식→정리 전체 순서 이해',sections:['전체 단계','현재 단계 요약','주의 상태'],states:['기본','로딩','단계 미확정'],next:['P11','P31','P42']},
{id:'P31',name:'단계 상세',purpose:'단계별 행동과 제품 상태 확인',sections:['단계 진행률','손–제품 이미지','행동 라벨','주의사항'],states:['기본','로딩','자산 미확정','완료'],next:['P11','P30','P32','P42']},
{id:'P32',name:'사용 전후',purpose:'조건부 검증 이미지로 상태 비교',sections:['전 상태','후 상태','촬영 기준','검증 상태'],states:['조건부 공개','로딩','자료 없음'],next:['P31','P40']},
{id:'P40',name:'품질·검증',purpose:'성능 주장과 검증 상태 구분',sections:['상태 범례','품질 항목','필요 자료','대체 구조 상태'],states:['기본','로딩','NOT_VERIFIED','오류'],next:['P11','P41','P42','P43']},
{id:'P41',name:'시험 근거',purpose:'조건부 시험 조건·결과·출처 공개',sections:['시험 대상','조건·방법','결과','출처·한계'],states:['조건부 공개','로딩','자료 없음','오류'],next:['P40','P72']},
{id:'P42',name:'주의·안전',purpose:'사용·보관·회피 행동 확인',sections:['사용 주의','보관 상태','안전 회피','검증 상태'],states:['기본','로딩','주의 자료 미확정'],next:['P30','P40']},
{id:'P43',name:'소재·폐기',purpose:'조건부 확정 소재와 폐기 방법 안내',sections:['소재','분리 방법','지역 조건','근거 상태'],states:['조건부 공개','로딩','자료 없음'],next:['P40']},
{id:'P50',name:'다음 행동',purpose:'조건부 확정 행동으로 이동',sections:['행동 목적','채널','정책 상태'],states:['조건부 공개','로딩','행동 미확정','오류'],next:['P11','P72']},
{id:'P60',name:'로그인',purpose:'가정: 저장 기능용 인증',sections:['이메일','비밀번호','오류 메시지'],states:['기본','입력 오류','인증 중','인증 실패','완료'],next:['P00','P61','P72']},
{id:'P61',name:'저장 항목',purpose:'가정: 저장 제품·단계 재진입',sections:['저장 제품','저장 단계','최근 확인'],states:['기본','로딩','빈 상태','오류'],next:['P00','P11','P31']},
{id:'P70',name:'검색 결과',purpose:'가정: 구조·단계·품질 정보 탐색',sections:['검색 입력','결과 분류','결과 목록'],states:['기본','로딩','빈 상태','오류'],next:['P11','P31','P40','P71']},
{id:'P71',name:'결과 없음',purpose:'조건 완화 후 핵심 탐색 복귀',sections:['빈 상태','대체 키워드','핵심 진입'],states:['기본'],next:['P10','P20','P70']},
{id:'P72',name:'오류 안내',purpose:'처리 실패 후 안전한 복귀',sections:['오류 요약','재시도','대체 경로'],states:['일시 오류','영구 오류'],next:['P00','P60']},
{id:'P73',name:'정책·접근성',purpose:'정책과 접근성 안내',sections:['정책 목록','접근성 안내','문의 상태'],states:['기본','문서 미확정'],next:['P00']}
];const byId=Object.fromEntries(screens.map(s=>[s.id,s]));let current='P00';
function flag(id){return ['P60','P61','P70'].includes(id)?'<span class="badge assume">가정</span>':['P32','P41','P43','P50'].includes(id)?'<span class="badge conditional">조건부</span>':''}
function render(id){const s=byId[id]||byId.P72;current=s.id;location.hash=s.id;document.querySelectorAll('#toc button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===s.id?'page':'false'));const cards=s.sections.map((x,i)=>`<article class="card"><div class="placeholder" role="img" aria-label="${x} 이미지 또는 정보 플레이스홀더">[플레이스홀더]<br>${x}</div><p>${i===0?'실제 제품·확정 자료를 우선합니다.':'자료가 없으면 NOT_VERIFIED 또는 HOLD로 표시합니다.'}</p></article>`).join('');const actions=s.next.map(n=>`<button data-go="${n}" class="${n==='P11'||n==='P00'?'primary':''}">${byId[n].name} (${n})</button>`).join('');document.querySelector('#screen').innerHTML=`<div class="meta"><div><span class="badge">${s.id}</span> ${flag(s.id)}<h2>${s.name}</h2><p>${s.purpose}</p></div><span class="badge">저충실도</span></div><div class="hero"><div><h3>화면 목적</h3><p>${s.purpose}</p><p><strong>원칙:</strong> 실제 구조·순서·근거를 분리해 표시합니다.</p><div class="actions">${actions}</div></div><div class="placeholder" role="img" aria-label="${s.name} 대표 이미지 플레이스홀더">[이미지: ${s.name} 대표 영역]</div></div><h3>구성 영역</h3><div class="grid">${cards}</div><div class="block"><h3>상태</h3><div class="states">${s.states.map(x=>`<span class="badge">${x}</span>`).join('')}</div></div>`;bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>{el.onclick=()=>render(el.dataset.go);if(el.classList.contains('logo'))el.onkeydown=e=>{if(e.key==='Enter')render('P00')}})}const toc=document.querySelector('#toc');toc.innerHTML=screens.map(s=>`<button data-go="${s.id}">${s.id} ${s.name}</button>`).join('');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#device').className='device '+b.dataset.size});bind();render(location.hash.slice(1)||'P00');window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId[id]&&id!==current)render(id)});
</script></body></html>
