<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="t d"><title id="t">YOVIA VC-004 서비스 흐름도</title><desc id="d">상황 또는 제품 탐색에서 상세 확인, 조건부 판매처와 구매 정책 확인까지 이어지는 흐름</desc><defs><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#202124}.tt{font-size:26px;font-weight:700}.n{font-size:14px}.p{fill:#e8f3ff;stroke:#357abd;stroke-width:2}.term{fill:#d7f5dc;stroke:#188038;stroke-width:2}.dec{fill:#fff4ce;stroke:#c58b00;stroke-width:2}.err{fill:#fde1dc;stroke:#c5221f;stroke-width:2}.l{fill:none;stroke:#5f6368;stroke-width:2}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5f6368"/></marker></defs><rect width="1500" height="950" fill="#fff"/><text x="40" y="48" class="tt">YOVIA VC-004 서비스 흐름도</text><text x="40" y="74" class="n">둥근형: 시작·종료 · 사각형: 화면 · 마름모: 판단 · 빨강: 예외</text><g class="l" marker-end="url(#a)"><path d="M130 150H230"/><path d="M390 150H490"/><path d="M630 150H720V280H260"/><path d="M630 150H720V280H900"/><path d="M260 310V400"/><path d="M900 310V400H720"/><path d="M900 400H1040"/><path d="M260 460L700 540"/><path d="M720 460V540"/><path d="M1040 460L700 540"/><path d="M780 570H900"/><path d="M1060 570H1160"/><path d="M1300 570V680"/><path d="M1230 710H1080"/><path d="M940 710H790"/><path d="M650 710V600"/><path d="M1300 740V840H1160"/><path d="M1020 870H880"/><path d="M740 870H600V150H390"/></g><g><rect x="40" y="120" width="90" height="60" rx="30" class="term"/><text x="85" y="156" text-anchor="middle" class="n">시작</text><rect x="230" y="120" width="160" height="60" class="p"/><text x="310" y="156" text-anchor="middle" class="n">홈</text><polygon points="560,105 630,150 560,195 490,150" class="dec"/><text x="560" y="156" text-anchor="middle" class="n">탐색 목적 선택</text><rect x="180" y="250" width="160" height="60" class="p"/><text x="260" y="286" text-anchor="middle" class="n">사용