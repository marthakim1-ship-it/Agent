<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">YOVIA 사이트맵</title><desc id="desc">홈에서 브랜드, 제품, 사용 가이드, 성분 및 신뢰 정보와 예외 페이지로 이어지는 계층 구조</desc>
<defs><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#202124}.t{font-size:26px;font-weight:700}.n{font-size:15px}.box{fill:#e8f3ff;stroke:#357abd;stroke-width:2}.cond{fill:#fff4ce;stroke:#c58b00;stroke-width:2}.err{fill:#fde1dc;stroke:#c5221f;stroke-width:2}.line{fill:none;stroke:#5f6368;stroke-width:2}.dash{stroke-dasharray:7 5}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5f6368"/></marker></defs>
