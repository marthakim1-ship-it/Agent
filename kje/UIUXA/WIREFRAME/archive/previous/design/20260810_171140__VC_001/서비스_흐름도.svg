<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc"><title id="title">YOVIA 서비스 흐름도</title><desc id="desc">탐색, 선택, 상세 확인, 핵심 행동, 결과 확인과 오류·로그인 가정 분기를 포함한 흐름</desc><defs><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111827}.t{font-size:26px;font-weight:700}.n{font-size:14px;font-weight:600}.user{fill:#eef7ff;stroke:#2563eb;stroke-width:2}.system{fill:#ecfdf5;stroke:#059669;stroke-width:2}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.error{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.terminal{fill:#111827;stroke:#111827;stroke-width:2}.terminalText{fill:#fff}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="1600" height="1180" fill="#fff"/><text x="40" y="48" class="t">YOVIA VC-001 서비스 흐름도</text>
<g class="line"><path d="M800 105V145M800 205V250"/><path d="M800 330L250 400M800 330L600 400M800 330L1050 400"/><path d="M250 460V520M600 460V520M1050 460V520"/><path d="M250 580L600 650M600 580V650M1050 580L600 650"/><path d="M600 710L220 780M600 710L480 780M600 710L760 780M600 710L1040 780"/><path d="M220 840L600 910M480 840L600 910M760 840L600 910M1040 840L600 910"/><path d="M600 970H900M900 970H1200"/><path d="M600 970L600 1050M1050 520L1350 520M1350 580V650M1350 710V780"/></g>
<ellipse cx="800" cy="90" rx="90" ry="30" class="terminal"/><text x="800" y="96" text-anchor="middle" class="n terminalText">시작</text><rect x="710" y="145" width="180" height="60" rx="10" class="user"/><text x="800" y="181" text-anchor="middle" class="n">P00 홈</text><polygon points="800,250 920,290 800,330 680,290" class="decision"/><text x="800" y="295" text-anchor="middle" class="n">탐색 목적?</text>
<rect x="160" y="400" width="180" height="60" rx="10" class="user"/><text x="250" y="436" text-anchor="middle" class="n">P40 사용 상황</text><rect x="510" y="400" width="180" height="60" rx="10" class="user"/><text x="600" y="436" text-anchor="middle" class="n">P21 제품 목록</text><rect x="960" y="400" width="180" height="60" rx="10" class="user"/><text x="1050" y="436" text-anchor="middle" class="n">P22 제품 상세</text>
<rect x="160" y="520" width="180" height="60" rx="10" class="user"/><text x="250" y="556" text-anchor="middle" class="n">P41 상황 상세</text><rect x="510" y="520" width="180" height="60" rx="10" class="user"/><text x="600" y="556" text-anchor="middle" class="n">P23 제품 비교</text><polygon points="1050,510 1150,550 1050,590 950,550" class="decision"/><text x="1050" y="555" text-anchor="middle" class="n">추가 확인?</text>
<rect x="510" y="650" width="180" height="60" rx="10" class="user"/><text x="600" y="686" text-anchor="middle" class="n">P22 제품 상세</text><rect x="1300" y="520" width="100" height="60" rx="10" class="error"/><text x="1350" y="545" text-anchor="middle" class="n">P81</text><text x="1350" y="566" text-anchor="middle" class="n">결과 없음</text>
