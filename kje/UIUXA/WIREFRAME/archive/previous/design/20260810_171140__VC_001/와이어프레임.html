<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOVIA VC-001 저충실도 와이어프레임</title>
<style>
:root{--ink:#172033;--muted:#64748b;--line:#cbd5e1;--panel:#f8fafc;--accent:#2563eb;--warn:#9a3412;--assume:#6d28d9}*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:#e2e8f0}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:20px;position:sticky;top:0;height:100vh;overflow:auto}.side h1{font-size:18px;margin:0 0 8px}.side p{font-size:12px;color:#cbd5e1}.toc{display:grid;gap:4px}.toc button{border:0;background:transparent;color:#e5e7eb;text-align:left;padding:8px;border-radius:6px;cursor:pointer}.toc button:hover,.toc button[aria-current="page"]{background:#334155}.main{padding:24px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer}.toolbar .active{background:#dbeafe;border-color:var(--accent)}.note{padding:10px 12px;background:#fff7ed;border-left:4px solid #ea580c;font-size:13px;margin-bottom:16px}.device{margin:auto;background:#fff;border:2px solid #334155;min-height:780px;box-shadow:0 12px 30px #0f172a22;transition:max-width .2s}.device.desktop{max-width:1200px}.device.tablet{max-width:820px}.device.mobile{max-width:390px}.site-head{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:#fff;z-index:2}.logo{font-weight:800;cursor:pointer}.global{display:flex;gap:10px;flex:1;flex-wrap:wrap}.global button{border:0;background:transparent;text-decoration:underline;cursor:pointer}.screen{padding:22px}.meta{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}.badge{display:inline-block;padding:3px 7px;border:1px solid currentColor;border-radius:999px;font-size:12px;color:var(--muted)}.badge.assume{color:var(--assume)}.badge.conditional{color:var(--warn)}.hero,.block{border:2px solid var(--line);background:var(--panel);padding:18px;margin:16px 0}.hero{min-height:180px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.placeholder{border:2px dashed #94a3b8;background:#fff;min-height:120px;display:grid;place-items:center;text-align:center;padding:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #94a3b8;background:#fff;padding:14px;min-height:140px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{padding:10px 13px;border:2px solid var(--ink);background:#fff;border-radius:5px;cursor:pointer}.actions .primary{background:var(--ink);color:#fff}.state-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.site-foot{border-top:1px solid var(--line);padding:18px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;font-size:13px}.site-foot button{border:0;background:transparent;text-decoration:underline;cursor:pointer}.mobile .global{display:none}.mobile .hero,.mobile .grid{grid-template-columns:1fr}.tablet .grid{grid-template-columns:repeat(2,1fr)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.toc{grid-template-columns:repeat(2,1fr)}.main{padding:10px}.device{max-width:100%!important}.hero,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><h1>YOVIA 화면 목차</h1><p>VC-001 · 저충실도 · 모든 버튼은 내부 화면 관계를 시연합니다.</p><nav id="toc" class="toc" aria-label="화면 목차"></nav></aside>
  <main class="main">
    <div class="toolbar" aria-label="반응형 미리보기"><strong>뷰포트</strong><button data-size="desktop" class="active">데스크톱</button><button data-size="tablet">태블릿</button><button data-size="mobile">모바일</button></div>
    <div class="note">가정: 로그인·내 활동·검색. 조건부: 품질·시험, 판매처·다음 행동. 미확정 값은 생성하지 않습니다.</div>
    <div id="device" class="device desktop">
      <header class="site-head"><div class="logo" tabindex="0" role="link" data-go="P00">YOVIA</div><nav class="global" aria-label="전역 메뉴"><button data-go="P20">제품</button><button data-go="P30">제품 구조</button><button data-go="P40">사용 상황</button><button data-go="P50">성분·영양</button><button data-go="P10">브랜드</button></nav><button data-go="P80">검색 <span class="badge assume">가정</span></button></header>
      <section id="screen" class="screen" aria-live="polite"></section>
      <footer class="site-foot"><span>CONFIRMED / NOT_VERIFIED / HOLD</span><span><button data-go="P83">정책·접근성</button> · <button data-go="P00">홈</button></span></footer>
    </div>
  </main>
</div>
<script>
const screens=[
{id:'P00',name:'홈',purpose:'브랜드·제품·사용 상황을 한 흐름으로 이해',sections:['제품 정의 히어로','사용 상황 카드','제품 구조 요약','신뢰 정보 요약'],states:['기본','로딩','오류'],next:['P10','P20','P30','P40','P50']},
{id:'P10',name:'브랜드',purpose:'YOVIA 정의와 표현 원칙 설명',sections:['브랜드 정의','핵심 대상·가치','표현·검증 원칙'],states:['기본','로딩'],next:['P20','P40','P00']},
{id:'P20',name:'제품',purpose:'제품 탐색 허브',sections:['제품 탐색 안내','제품 목록 진입','제품 구조 진입','조건부 다음 행동'],states:['기본','로딩'],next:['P21','P30','P60']},
{id:'P21',name:'제품 목록',purpose:'확정 제품 선택지 탐색',sections:['필터·정렬','제품 카드 목록','상태 라벨'],states:['기본','로딩','빈 상태','오류'],next:['P22','P23','P81','P82']},
{id:'P22',name:'제품 상세',purpose:'제품 구조·사용법·신뢰·행동 통합 확인',sections:['제품 갤러리','핵심 정보','구조·사용법','성분·검증 요약','조건부 CTA'],states:['기본','로딩','미확정 정보','오류'],next:['P23','P30','P31','P50','P51','P60','P70']},
{id:'P23',name:'제품 비교',purpose:'확정 옵션 차이 판단',sections:['비교 대상','비교 속성','검증 상태'],states:['기본','로딩','비교 항목 부족'],next:['P21','P22']},
{id:'P30',name:'제품 구조',purpose:'파우치·스푼·토핑 관계 이해',sections:['실제 제품 이미지','부품 라벨','관계 설명','검증 상태'],states:['기본','로딩','자산 미확정'],next:['P22','P31']},
{id:'P31',name:'사용 방법',purpose:'개봉→섭취→정리 순서 이해',sections:['단계 표시','행동 이미지','주의·검증 상태'],states:['기본','로딩','단계 자산 미확정'],next:['P30','P22','P40']},
{id:'P40',name:'사용 상황',purpose:'자신의 일상 맥락 탐색',sections:['상황 소개','출근·등교·이동·업무 카드','안전 안내'],states:['기본','로딩'],next:['P41','P22']},
{id:'P41',name:'상황 상세',purpose:'상황 문제와 제품 가치 연결',sections:['상황 장면','문제·가치','사용 단계 요약','관련 제품'],states:['기본','로딩','관련 제품 없음'],next:['P22','P31','P40']},
{id:'P50',name:'성분·영양',purpose:'원료·영양·알레르기 빠른 확인',sections:['확정 속성','원료','영양 기준량','알레르기·주의'],states:['기본','로딩','정보 미확정','오류'],next:['P22','P51','P82']},
{id:'P51',name:'검증 정보',purpose:'출처·기준일·검증 상태 확인',sections:['상태 범례','근거 목록','기준일·적용 범위','금지 주장 안내'],states:['기본','로딩','근거 없음'],next:['P22','P50','P52']},
{id:'P52',name:'품질·시험',purpose:'조건부 시험 자료 공개',sections:['시험 대상','조건·방법','결과·출처','한계'],states:['조건부 공개','자료 없음'],next:['P51']},
{id:'P60',name:'판매처·다음 행동',purpose:'확정 판매 채널로 이동',sections:['CTA 목적','판매 채널','가격·정책 상태'],states:['조건부 공개','채널 미확정','오류'],next:['P22','P82']},
{id:'P70',name:'로그인',purpose:'가정: 저장 기능용 회원 인증',sections:['이메일 입력','비밀번호 입력','오류 메시지'],states:['기본','입력 오류','인증 중','인증 실패','완료'],next:['P71','P82','P00']},
{id:'P71',name:'내 활동',purpose:'가정: 저장 제품·비교 재진입',sections:['저장 제품','저장 비교','최근 확인'],states:['기본','로딩','빈 상태'],next:['P22','P23','P00']},
{id:'P80',name:'검색 결과',purpose:'가정: 키워드 기반 탐색',sections:['검색 입력','결과 분류','결과 목록'],states:['기본','로딩','빈 상태'],next:['P22','P81','P82']},
{id:'P81',name:'결과 없음',purpose:'검색·필터 실패 후 재탐색',sections:['빈 상태 안내','대체 조건','추천 진입'],states:['기본'],next:['P21','P80']},
{id:'P82',name:'오류 안내',purpose:'처리 실패 후 안전한 복귀',sections:['오류 요약','재시도 안내','대체 경로'],states:['일시 오류','영구 오류'],next:['P00','P70']},
{id:'P83',name:'정책·접근성',purpose:'정책과 접근성 안내',sections:['정책 목록','접근성 안내','문의 경로 상태'],states:['기본','문서 미확정'],next:['P00']}
];
const byId=Object.fromEntries(screens.map(s=>[s.id,s]));let current='P00';
function flag(id){return ['P70','P71','P80'].includes(id)?'<span class="badge assume">가정</span>':['P52','P60'].includes(id)?'<span class="badge conditional">조건부</span>':''}
function render(id){const s=byId[id]||byId.P82;current=s.id;location.hash=s.id;document.querySelectorAll('#toc button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===s.id?'page':'false'));const sectionCards=s.sections.map((x,i)=>`<article class="card"><div class="placeholder" role="img" aria-label="${x}용 이미지 또는 콘텐츠 플레이스홀더">[플레이스홀더]<br>${x}</div><p>${i===0?'핵심 정보와 상태를 우선 표시합니다.':'확정 자료만 표시하며 미확정 값은 NOT_VERIFIED로 남깁니다.'}</p></article>`).join('');const buttons=s.next.map(n=>`<button data-go="${n}" class="${n==='P22'||n==='P00'?'primary':''}">${byId[n].name} (${n})</button>`).join('');document.querySelector('#screen').innerHTML=`<div class="meta"><div><span class="badge">${s.id}</span> ${flag(s.id)}<h2>${s.name}</h2><p>${s.purpose}</p></div><span class="badge">저충실도</span></div><div class="hero"><div><h3>화면 목적</h3><p>${s.purpose}</p><p><strong>입력 근거:</strong> VC-001 분석 결과와 선행 설계 문서</p><div class="actions">${buttons}</div></div><div class="placeholder" role="img" aria-label="${s.name} 대표 이미지 플레이스홀더">[이미지: ${s.name} 대표 영역]</div></div><h3>화면 구성 영역</h3><div class="grid">${sectionCards}</div><div class="block"><h3>상태</h3><div class="state-row">${s.states.map(x=>`<span class="badge">${x}</span>`).join('')}</div></div>`;bind();document.querySelector('#screen').focus?.();}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>{el.onclick=()=>render(el.dataset.go);if(el.classList.contains('logo'))el.onkeydown=e=>{if(e.key==='Enter')render('P00')}})}
const toc=document.querySelector('#toc');toc.innerHTML=screens.map(s=>`<button data-go="${s.id}">${s.id} ${s.name}</button>`).join('');
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#device').className='device '+b.dataset.size});
bind();render(location.hash.slice(1)||'P00');window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId[id]&&id!==current)render(id)});
</script>
</body>
</html>
